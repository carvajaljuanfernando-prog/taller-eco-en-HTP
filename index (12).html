<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Taller interactivo: cuatro casos con informe de ecocardiograma y cinco preguntas guiadas para leerlo en hipertensión pulmonar.">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Lectura guiada del eco en HP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: UI chrome in navy; the report is a white "printout" pinned left, the guided questions scroll right. */
:root{
  --bg:#E9EDF2; --paper:#FFFFFF; --panel:#F6F7F9; --ink:#273670; --body:#2F3E4F; --muted:#66758A;
  --line:#D5DCE4; --navy:#273670; --navy-2:#3E538A; --gold:#C87534; --gold-soft:#F8E8D8; --teal:#3E9289;
  --ok:#2F7D4F; --ok-soft:#E3F1E7; --bad:#A33A3A; --bad-soft:#F6E3E3; --on-navy:#F5F2EB; --on-navy-muted:#B9C6D3;
  --font-ui:'IBM Plex Sans',system-ui,Arial,sans-serif; --font-head:'Space Grotesk','IBM Plex Sans',Arial,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --base:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1A2B; --paper:#112941; --panel:#0E2236; --ink:#EEF2F6; --body:#C9D4DF; --muted:#8FA1B3; --line:#294661;
  --navy:#1B2A57; --navy-2:#2E4480; --gold:#E89A5C; --gold-soft:#3F2E1E; --teal:#6CC2B4; --ok:#6CC08B; --ok-soft:#163626; --bad:#E08484; --bad-soft:#3E1C1C; --on-navy:#F5F2EB; --on-navy-muted:#B9C6D3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1A2B; --paper:#112941; --panel:#0E2236; --ink:#EEF2F6; --body:#C9D4DF; --muted:#8FA1B3; --line:#294661;
  --navy:#1B2A57; --navy-2:#2E4480; --gold:#E89A5C; --gold-soft:#3F2E1E; --teal:#6CC2B4; --ok:#6CC08B; --ok-soft:#163626; --bad:#E08484; --bad-soft:#3E1C1C; --on-navy:#F5F2EB; --on-navy-muted:#B9C6D3; color-scheme:dark}
html{font-size:var(--base)}
html.big{--base:20px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--body);font-family:var(--font-ui);margin:0;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--font-head);color:var(--ink);margin:0;text-wrap:balance;line-height:1.15}
.hdr{background:var(--navy);color:var(--on-navy);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hdr-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:.75rem;display:flex;flex-wrap:wrap;gap:.75rem 1.25rem;align-items:center}
.logo{height:2.6rem;width:auto;max-width:40vw;flex:none}
.brand{display:flex;flex-direction:column;gap:.1rem;min-width:0;padding-left:.9rem;border-left:1px solid rgba(255,255,255,.25)}
.brand .eyebrow{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.brand h1{color:var(--on-navy);font-size:1.15rem;font-weight:700}
.cases{display:flex;gap:.4rem;flex-wrap:wrap;flex:1}
.case-btn{border:1px solid rgba(255,255,255,.22);background:transparent;color:var(--on-navy);border-radius:999px;padding:.35rem .85rem;font-size:.85rem;font-weight:500}
.case-btn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#FFFFFF;font-weight:600}
.tools{display:flex;gap:.4rem;flex-wrap:wrap}
.tool{border:1px solid rgba(255,255,255,.22);background:transparent;color:var(--on-navy-muted);border-radius:8px;padding:.35rem .7rem;font-size:.8rem}
.tool[aria-pressed="true"]{background:var(--navy-2);color:var(--on-navy);border-color:var(--on-navy-muted)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:1.25rem 3rem;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:1.25rem;max-width:1600px;margin:0 auto}
@media (max-width:980px){.wrap{grid-template-columns:1fr}.report-col{position:static!important;max-height:none!important}}
.report-col{position:sticky;top:calc(4.6rem + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 5.6rem - env(safe-area-inset-top,0px));overflow:auto;min-width:0}
/* The report: a lab printout */
.report{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:1.25rem 1.4rem 1.5rem;font-size:.84rem;position:relative;min-width:0}
.report .stamp{position:absolute;right:1rem;top:.9rem;border:1.5px solid var(--bad);color:var(--bad);font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;padding:.15rem .5rem;transform:rotate(-4deg);font-weight:600;background:var(--paper)}
.report-head{border-bottom:2px solid var(--ink);padding-bottom:.6rem;margin-bottom:.8rem}
.report-head .lab{font-family:var(--font-head);font-weight:700;font-size:1rem;letter-spacing:.02em}
.report-head .sub{font-size:.75rem;color:var(--muted)}
.idgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.25rem .9rem;font-size:.78rem;margin-bottom:.9rem}
.idgrid div span{color:var(--muted)}
.rsec{margin-top:.9rem}
.rsec h3{font-family:var(--font-ui);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:.2rem;margin-bottom:.3rem}
.rt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rt td{padding:.22rem .35rem;border-bottom:1px dotted var(--line);vertical-align:top}
.rt td.v{font-family:var(--font-mono);white-space:nowrap;font-weight:500}
.rt td.ref{color:var(--muted);font-size:.74rem;white-space:nowrap}
.rt td.prev{font-family:var(--font-mono);color:var(--muted);white-space:nowrap}
.rt tr.hl td{background:var(--gold-soft);box-shadow:inset 3px 0 0 var(--gold)}
.rt tr.hl td:first-child{font-weight:600}
.rt .colh td{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.concl{margin-top:1rem;border:1px solid var(--ink);padding:.7rem .9rem;border-radius:4px}
.concl h3{font-family:var(--font-ui);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem}
.concl p{margin:0;font-size:.86rem;line-height:1.5}
.concl.hl{background:var(--gold-soft);border-color:var(--gold)}
.sign{margin-top:.8rem;font-size:.74rem;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.3rem}
/* Right column */
.steps-col{min-width:0;display:flex;flex-direction:column;gap:1rem}
.vignette{background:var(--navy-2);color:var(--on-navy);border-radius:10px;padding:1.1rem 1.25rem;display:flex;flex-direction:column;gap:.4rem}
.vignette .eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.vignette h2{color:var(--on-navy);font-size:1.35rem}
.vignette p{margin:0;color:var(--on-navy-muted);font-size:.95rem}
.stepnav{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.stepnav button{border:1px solid var(--line);background:var(--panel);color:var(--body);border-radius:999px;padding:.3rem .75rem;font-size:.8rem;font-weight:500;display:flex;gap:.4rem;align-items:center}
.stepnav button[aria-current="step"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stepnav button.done::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--ok);display:inline-block}
.stepnav button.done.wrong::before{background:var(--bad)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);transition:width .3s}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:1.25rem 1.4rem;display:flex;flex-direction:column;gap:.9rem;min-width:0}
.card .eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600;display:flex;gap:.6rem;align-items:baseline}
.card .eyebrow b{font-family:var(--font-head);font-size:1.6rem;color:var(--ink);letter-spacing:0}
.card h2{font-size:1.35rem}
.card .lead{margin:0;font-size:1rem;color:var(--body);max-width:65ch}
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:.7rem .9rem;display:flex;gap:.8rem;align-items:flex-start;line-height:1.4;font-size:.95rem}
.opt .k{font-family:var(--font-head);font-weight:700;color:var(--muted);min-width:1.2rem}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt:disabled{cursor:default;opacity:.75}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);opacity:1}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:1}
.opt.reveal{border-style:dashed;border-color:var(--ok);opacity:1}
.fb{border-radius:8px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.45rem;font-size:.95rem}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.fb .verdict{font-weight:600;color:var(--ink)}
.fb p{margin:0}
.where{display:flex;gap:.5rem;align-items:flex-start;font-size:.85rem;color:var(--muted)}
.where .tag{background:var(--gold-soft);color:var(--ink);border-radius:4px;padding:.05rem .4rem;font-size:.75rem;font-weight:600;white-space:nowrap;border-left:3px solid var(--gold)}
.pearl{border:1px solid var(--line);border-radius:8px;padding:.8rem 1rem;font-size:.9rem;background:var(--panel)}
.pearl b{color:var(--ink)}
.facil{border:1px dashed var(--teal);border-radius:8px;padding:.8rem 1rem;font-size:.88rem;color:var(--body)}
.facil .lbl{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:600;margin-bottom:.25rem}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:space-between;align-items:center}
.btn{border:none;background:var(--ink);color:var(--paper);border-radius:8px;padding:.6rem 1.1rem;font-weight:600;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.6rem}
.sum .tile{border:1px solid var(--line);border-radius:8px;padding:.7rem .85rem;background:var(--panel);display:flex;flex-direction:column;gap:.2rem;min-width:0}
.sum .tile .l{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sum .tile .v{font-weight:600;color:var(--ink);font-size:.95rem}
.missing{border-left:4px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:.8rem 1rem}
.missing h3{font-size:.95rem;margin-bottom:.3rem}
.missing ul{margin:0;padding-left:1.1rem;font-size:.9rem}
.score{font-family:var(--font-head);font-size:1.4rem;color:var(--ink);font-weight:700}
.note{font-size:.78rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

const state={ci:0, step:0, answers:{}, facil:false};
try{const s=JSON.parse(localStorage.getItem('ecohp-state')||'null'); if(s&&typeof s.ci==='number'){Object.assign(state,s)} }catch(e){}
try{ if(localStorage.getItem('ecohp-big')==='1') document.documentElement.classList.add('big'); }catch(e){}
function save(){try{localStorage.setItem('ecohp-state',JSON.stringify({ci:state.ci,step:state.step,answers:state.answers,facil:state.facil}))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== Render ===== */
function renderCaseNav(){
  $('#caseNav').innerHTML=CASES.map((c,i)=>`<button class="case-btn" data-i="${i}" aria-pressed="${i===state.ci}">${esc(c.chip)}</button>`).join('');
}
function renderReport(){
  const c=CASES[state.ci]; const hasPrev=!!c.prevLabel;
  const step=c.steps[state.step-1]; const keys=new Set(step?step.keys:[]);
  const id=c.pt;
  let h=`<span class="stamp">Caso docente · datos ficticios</span>
  <div class="report-head"><div class="lab">Laboratorio de Ecocardiografía</div><div class="sub">Informe de ecocardiograma transtorácico bidimensional, Doppler color, pulsado, continuo y tisular</div></div>
  <div class="idgrid">
   <div><span>Paciente: </span>${esc(id.ini)}</div><div><span>Edad: </span>${esc(id.edad)}</div><div><span>Sexo: </span>${esc(id.sexo)}</div><div><span>SC: </span>${esc(id.sc)}</div>
   <div><span>Fecha: </span>${esc(id.fecha)}</div><div><span>Remite: </span>${esc(id.remite)}</div><div class="${keys.has('ritmo')?'hlid':''}"><span>Ritmo / FC: </span>${esc(id.ritmo)}</div><div><span>PA: </span>${esc(id.pa)}</div>
   <div style="grid-column:1/-1"><span>Indicación: </span>${esc(id.ind)}</div>
   <div style="grid-column:1/-1" class="${keys.has('ventana')?'hlid':''}"><span>Calidad de ventana: </span>${esc(id.ventana)}</div>
  </div>`;
  for(const sec of c.rows){
    h+=`<div class="rsec"><h3>${esc(sec.sec)}</h3><table class="rt">`;
    if(hasPrev) h+=`<tr class="colh"><td>Parámetro</td><td>Actual</td><td>${esc(c.prevLabel)}</td><td>Ref.</td></tr>`;
    for(const r of sec.items){
      h+=`<tr data-k="${r.k}" class="${keys.has(r.k)?'hl':''}"><td>${esc(r.l)}</td><td class="v">${esc(r.v)}</td>${hasPrev?`<td class="prev">${esc(r.p||'—')}</td>`:''}<td class="ref">${esc(r.ref||'')}</td></tr>`;
    }
    h+=`</table></div>`;
  }
  const concHl = state.step===0 || state.step>c.steps.length;
  h+=`<div class="concl ${concHl?'hl':''}"><h3>Conclusión</h3><p>${esc(c.conclusion)}</p></div>
  <div class="sign"><span>Realizó: médico ecocardiografista · Firma digital</span><span>Equipo: ecógrafo con sonda sectorial 1–5 MHz</span></div>`;
  $('#report').innerHTML=h;
  document.querySelectorAll('.hlid').forEach(el=>{el.style.background='var(--gold-soft)';el.style.boxShadow='inset 3px 0 0 var(--gold)';el.style.paddingLeft='.4rem'});
}
function renderVignette(){
  const c=CASES[state.ci];
  $('#vignette').innerHTML=`<span class="eyebrow">Caso ${state.ci+1} de ${CASES.length}</span><h2>${esc(c.title)}</h2><p>${esc(c.vignette)}</p>`;
}
function renderStepNav(){
  const c=CASES[state.ci]; const a=state.answers[c.id]||{};
  const total=c.steps.length+2;
  let h=`<button data-s="0" aria-current="${state.step===0?'step':'false'}">Informe</button>`;
  c.steps.forEach((s,i)=>{const done=a[i]!==undefined; const wrong=done&&a[i]!==s.ans;
    h+=`<button data-s="${i+1}" class="${done?'done':''} ${wrong?'wrong':''}" aria-current="${state.step===i+1?'step':'false'}">${s.n}</button>`});
  h+=`<button data-s="${c.steps.length+1}" aria-current="${state.step===c.steps.length+1?'step':'false'}">Síntesis</button>`;
  $('#stepNav').innerHTML=h;
  $('#prog').style.width=Math.round(state.step/(total-1)*100)+'%';
}
function renderStep(){
  const c=CASES[state.ci]; const a=state.answers[c.id]||{}; const card=$('#stepCard');
  if(state.step===0){
    card.innerHTML=`<span class="eyebrow">Paso 0</span><h2>Lea el informe como llegó a su consulta</h2>

    ${state.facil?`<div class="facil"><div class="lbl">Para el facilitador</div>Pregunte al grupo, antes de avanzar: «¿Con qué frase se quedaría de esta conclusión?». Anote las respuestas; al final del caso se contrastan con la síntesis.</div>`:''}
    <div class="actions"><span class="note">Use las flechas ← → del teclado para avanzar.</span><button class="btn" data-go="1">Empezar con la pregunta 1</button></div>`;
    return;

  if(state.step>c.steps.length){
    const n=c.steps.length; const hits=c.steps.filter((s,i)=>a[i]===s.ans).length;
    card.innerHTML=`<span class="eyebrow">Síntesis</span><h2>Lo que el informe decía, leído con la sistemática</h2>
    <div class="sum">
      <div class="tile"><span class="l">Probabilidad</span><span class="v">${esc(c.summary.prob)}</span></div>

    </div>
    <div class="missing"><h3>Lo que el informe no dijo (y debió decir)</h3><ul>${c.missing.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>
    <div class="actions"><span class="score">Aciertos: ${hits} / ${n}</span>
      <span style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn ghost" data-reset="1">Reiniciar caso</button>${state.ci<CASES.length-1?`<button class="btn" data-next-case="1">Siguiente caso</button>`:`<button class="btn" data-case="0">Volver al caso 1</button>`}</span></div>`;
    return;
  }
  const i=state.step-1, s=c.steps[i], chosen=a[i];
  const answered=chosen!==undefined;
  const letters='ABCD';
  card.innerHTML=`<span class="eyebrow"><b>${s.n}</b> ${esc(s.q)}</span><h2>${esc(s.title)}</h2>
  <div class="where"><span class="tag">En el informe</span><span>Las filas resaltadas en dorado contienen los datos para responder.</span></div>
  <div class="opts">${s.opts.map((o,j)=>{
     let cls='opt'; if(answered){ if(j===s.ans) cls+=' correct'; else if(j===chosen) cls+=' wrong'; } else if(state.facil&&j===s.ans) cls+=' reveal';
     return `<button class="${cls}" data-opt="${j}" ${answered?'disabled':''}><span class="k">${letters[j]}</span><span>${esc(o)}</span></button>`}).join('')}</div>
  ${answered?`<div class="fb ${chosen===s.ans?'ok':'bad'}"><span class="verdict">${chosen===s.ans?'Correcto.':'No es la mejor opción. La respuesta es '+letters[s.ans]+'.'}</span><p>${esc(s.why)}</p></div>
  <div class="pearl">${s.pearl}</div>`:''}
  ${state.facil?`<div class="facil"><div class="lbl">Para el facilitador</div>${esc(s.facil)}</div>`:''}
  <div class="actions"><button class="btn ghost" data-go="${state.step-1}">Anterior</button>${answered||state.facil?`<button class="btn" data-go="${state.step+1}">${state.step===c.steps.length?'Ver síntesis':'Siguiente pregunta'}</button>`:`<span class="note">Elija una opción para ver la explicación.</span>`}</div>`;
}
function renderAll(){renderCaseNav();renderVignette();renderStepNav();renderReport();renderStep();save();}
function go(n){const c=CASES[state.ci]; state.step=Math.max(0,Math.min(c.steps.length+1,n)); renderStepNav(); renderReport(); renderStep(); save(); $('#stepCard').scrollIntoView({block:'nearest'});}
function setCase(i){state.ci=i; state.step=0; renderAll(); window.scrollTo({top:0});}

/* ===== Eventos ===== */
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.i!==undefined){setCase(+b.dataset.i);return}
  if(b.dataset.case!==undefined){setCase(+b.dataset.case);return}
  if(b.dataset.nextCase){setCase(state.ci+1);return}
  if(b.dataset.s!==undefined){go(+b.dataset.s);return}
  if(b.dataset.go!==undefined){go(+b.dataset.go);return}
  if(b.dataset.opt!==undefined){const c=CASES[state.ci]; state.answers[c.id]=state.answers[c.id]||{}; state.answers[c.id][state.step-1]=+b.dataset.opt; renderStepNav(); renderStep(); save(); return}
  if(b.dataset.reset){const c=CASES[state.ci]; delete state.answers[c.id]; go(0); return}
  if(b.id==='facilBtn'){state.facil=!state.facil; b.setAttribute('aria-pressed',state.facil); renderStep(); save(); return}
  if(b.id==='bigBtn'){const on=document.documentElement.classList.toggle('big'); b.setAttribute('aria-pressed',on); try{localStorage.setItem('ecohp-big',on?'1':'0')}catch(e){} return}
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(e.key==='ArrowRight'){go(state.step+1)} else if(e.key==='ArrowLeft'){go(state.step-1)}
});
$('#facilBtn').setAttribute('aria-pressed',state.facil);
$('#bigBtn').setAttribute('aria-pressed',document.documentElement.classList.contains('big'));
renderAll();
</script>

</body>
</html>
